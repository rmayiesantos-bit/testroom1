<script>
(()=>{'use strict';
const q=s=>document.querySelector(s),mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* ---- audio (synthesized, off until the player interacts; music is OFF by default) ---- */
const A={m:.7,mu:.35,fx:.8,mute:false,music:false};
try{Object.assign(A,JSON.parse(localStorage.getItem('ar_audio')||'{}'))}catch(e){}
let X,gM,gMu,gFx,mt;
const keep=()=>{try{localStorage.setItem('ar_audio',JSON.stringify(A))}catch(e){}};
function ac(){if(!X){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;X=new C();gM=X.createGain();gMu=X.createGain();gFx=X.createGain();gMu.connect(gM);gFx.connect(gM);gM.connect(X.destination);vol()}if(X.state=='suspended')X.resume();return X}
function vol(){if(!X)return;gM.gain.value=A.mute?0:A.m;gMu.gain.value=A.mu*.6;gFx.gain.value=A.fx}
function tone(f,d,ty,v,bus,t0){const x=ac();if(!x||A.mute)return;const t=x.currentTime+(t0||0),o=x.createOscillator(),g=x.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(bus||gFx);o.start(t);o.stop(t+d+.05)}
const S={click:()=>tone(520,.08,'triangle',.12),ok:()=>{tone(660,.15,'sine',.18);tone(880,.2,'sine',.15,0,.09)},buy:()=>{[660,830,990,1320].forEach((f,i)=>tone(f,.25,'triangle',.16,0,i*.07))},err:()=>tone(180,.22,'sawtooth',.1)};
function musicOn(){if(mt||!ac())return;const P=[261.6,293.7,329.6,392,440,523.3];mt=setInterval(()=>{if(A.mute)return;const f=P[Math.random()*P.length|0];tone(f/2,3.2,'sine',.22,gMu);if(Math.random()<.5)tone(f,2.4,'sine',.1,gMu,.4)},2200)}
function musicOff(){clearInterval(mt);mt=null}
/* ---- ambient background ---- */
const bg=mk('div');bg.id='ar-bg';
if(!RM){for(let i=0;i<3;i++){const r=mk('div','ray');r.style.left=(10+i*32)+'vw';r.style.animationDelay=(-i*3)+'s';bg.appendChild(r)}
 [[.5,8,6],[1,10,10],[2,6,16]].forEach(([k,n,sz])=>{const l=mk('div','ly');l.dataset.k=k;for(let i=0;i<n;i++){const b=mk('span','b'),s=sz*(.6+Math.random()*1.2);b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${14+Math.random()*16-k*3}s;animation-delay:${-Math.random()*25}s;--dx:${Math.random()*50-25}px;opacity:${.25+k*.2}`;l.appendChild(b)}bg.appendChild(l)});
 let raf=0;addEventListener('pointermove',e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;bg.querySelectorAll('.ly').forEach(l=>l.style.transform=`translate(${-x*l.dataset.k*30}px,${-y*l.dataset.k*20}px)`)})},{passive:true})}
document.body.prepend(bg);
/* ---- page transitions (wraps the game's own go()) ---- */
const m=q('#m');function fade(){if(RM)return;m.classList.remove('ar-in');void m.offsetWidth;m.classList.add('ar-in')}
if(typeof window.go=='function'){const g0=window.go;window.go=function(){const r=g0.apply(this,arguments);fade();return r}}
/* ---- item cards: details panel data + rarity glow (reads only what the card already shows) ---- */
function rarityOf(t){const TNn=window.TN||[];const i=TNn.findIndex(n=>new RegExp('\\b'+n+'\\b','i').test(t));return i}
let pend=0;new MutationObserver(()=>{if(pend)return;pend=requestAnimationFrame(()=>{pend=0;document.querySelectorAll('.mc:not([data-ar])').forEach((c,i)=>{c.dataset.ar=1;c.tabIndex=0;c.setAttribute('role','button');c.style.setProperty('--d',(i%7)*.25+'s');const r=rarityOf(c.textContent);if(r>=1&&window.TCOL){c.classList.add('ar-hi');c.style.setProperty('--rc',TCOL[r]);if(r>=4)c.classList.add('ar-top')}})})}).observe(m,{childList:true,subtree:true});
const T=(e,s)=>{const n=e.querySelector(s);return n?n.textContent.trim():''};
function overlay(h,onClose){const o=mk('div','ar-ov'),p=mk('div','ar-pn',h);p.setAttribute('role','dialog');p.setAttribute('aria-modal','true');o.appendChild(p);const x=()=>{o.remove();removeEventListener('keydown',k,true);onClose&&onClose()},k=e=>{if(e.key=='Escape'){e.stopPropagation();x()}};o.addEventListener('click',e=>{if(e.target==o)x()});addEventListener('keydown',k,true);document.body.appendChild(o);const f=p.querySelector('button');f&&f.focus();return{o,p,x}}
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function info(c){
 const name=T(c,'.mc-t b'),sub=T(c,'.mc-t .mut'),desc=T(c,'.mc-d'),b=c.querySelector('button.buy'),bt=b?b.textContent.trim():'',ic=T(c,'.tile'),all=sub+' '+desc,ri=rarityOf(all);
 const fish=/❤️/.test(desc),upg=/Level|One-time|You have/.test(sub),look=!desc;
 const purpose=fish?'A fish for your tank. Bigger and rarer fish pay more coins and fight better.':upg?'An upgrade that makes your aquarium stronger.':look?'A look for your aquarium. It changes how things look. It does not change your stats.':'An item for your aquarium.';
 const stats=desc.split(/[·.]/).map(s=>s.trim()).filter(s=>/\d/.test(s)&&s.length<60);
 const lock=bt.match(/Needs (\d+)/),price=bt.match(/^(\d+)\s*🪙/),owned=/✓/.test(bt);
 const req=[];if(lock)req.push('Reach '+lock[1]+' ⭐ stars to unlock.');if(price)req.push('Cost: '+price[1]+' 🪙 coins.');if(owned)req.push('You already have this.');if(/full/i.test(bt))req.push('You need free space in your tank.');if(!req.length)req.push('None.');
 const nm=c.querySelector('.mc-f .mut'),how=lock?['Play and earn stars.','Come back when you have '+lock[1]+' ⭐.','Press the price button to buy.']:owned?['You own this already.','Use it from your tank or Customize screen.']:['Press the price button.','Press “Yes, buy it” to confirm.','It is added right away.'+(nm?' (Tip: '+nm.textContent.trim()+'.)':'')];
 const rar=ri>=0?`<span style="color:${window.TCOL?TCOL[ri]:'inherit'};font-weight:600">${TN[ri]}</span>`:'Not rated';
 const h=`<div class="ar-big">${E(ic)}</div><h3>${E(name)}</h3><div class="mut">${E(sub)}</div><dl><dt>Purpose</dt><dd>${purpose}</dd><dt>Effect</dt><dd>${E(desc||'Changes how your aquarium looks.')}</dd><dt>How to use</dt><dd><ol>${how.map(s=>'<li>'+E(s)+'</li>').join('')}</ol></dd><dt>Stats</dt><dd>${stats.length?stats.map(E).join('<br>'):'No stat bonuses.'}</dd><dt>Rarity</dt><dd>${rar}</dd><dt>Requirements</dt><dd>${req.map(E).join('<br>')}</dd></dl><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="ghost" data-x>Close</button></div>`;
 const d=overlay(h);d.p.querySelector('[data-x]').onclick=d.x}
document.addEventListener('click',e=>{const c=e.target.closest('.mc');if(c&&!e.target.closest('button')){S.click();info(c)}});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.classList&&e.target.classList.contains('mc')){e.preventDefault();info(e.target)}});
/* ---- purchase confirmation + success effect ---- */
let pass=0,busy=0;
function burst(el,em){if(RM)return;const r=el.getBoundingClientRect();for(let i=0;i<14;i++){const p=mk('span','ar-p',em[i%em.length]);p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';const a=Math.random()*6.28,d=40+Math.random()*70;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d-30+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),950)}}
document.addEventListener('click',e=>{const b=e.target.closest('#mkb button.buy[data-buy],#mkb button.buy[data-lb]');if(!b||pass||b.disabled)return;e.preventDefault();e.stopImmediatePropagation();if(busy)return;busy=1;
 const c=b.closest('.mc'),nm=T(c,'.mc-t b'),pr=b.textContent.trim(),d=overlay(`<h3>Buy ${E(nm)}?</h3><p>This costs <b>${E(pr)}</b>. You cannot undo it.</p><div class="row" style="justify-content:flex-end"><button class="ghost" data-n>Cancel</button><button data-y>Yes, buy it</button></div>`,()=>{busy=0});
 d.p.querySelector('[data-n]').onclick=d.x;
 d.p.querySelector('[data-y]').onclick=()=>{const before=window.me?me.coins:null,had=c.querySelector('.tile').textContent;d.x();pass=1;b.click();pass=0;setTimeout(()=>{const ok=before!=null&&window.me&&me.coins<before;if(ok){S.buy();burst(b,['✨','🪙','⭐','🫧'])}else S.err()},250)}},true);
/* ---- sounds for clicks and toasts ---- */
document.addEventListener('click',e=>{if(e.target.closest('button')&&!e.defaultPrevented)S.click()});
new MutationObserver(l=>l.forEach(r=>r.addedNodes.forEach(n=>{const t=n.textContent||'';/not|cannot|could|already|enough|full|wrong/i.test(t)?S.err():S.ok()}))).observe(q('#toast'),{childList:true});
/* ---- audio controls ---- */
const w=mk('div');w.id='ar-snd';w.innerHTML=`<div id="ar-sp"><b>Sound</b><label>Mute all <input type="checkbox" id="a-mute"></label><label>Music (soft) <input type="checkbox" id="a-music"></label><label>Master <input type="range" min="0" max="1" step=".05" id="a-m" aria-label="Master volume"></label><label>Music <input type="range" min="0" max="1" step=".05" id="a-mu" aria-label="Music volume"></label><label>Effects <input type="range" min="0" max="1" step=".05" id="a-fx" aria-label="Effects volume"></label></div><button aria-label="Sound settings" title="Sound settings">🔊</button>`;document.body.appendChild(w);
const sp=q('#ar-sp'),bt=w.querySelector('button'),I=id=>q('#'+id);
I('a-mute').checked=A.mute;I('a-music').checked=false;I('a-m').value=A.m;I('a-mu').value=A.mu;I('a-fx').value=A.fx;bt.textContent=A.mute?'🔇':'🔊';
bt.onclick=()=>sp.classList.toggle('o');
sp.addEventListener('input',e=>{A.mute=I('a-mute').checked;A.m=+I('a-m').value;A.mu=+I('a-mu').value;A.fx=+I('a-fx').value;A.music=I('a-music').checked;bt.textContent=A.mute?'🔇':'🔊';keep();ac();vol();A.music&&!A.mute?musicOn():musicOff()});
})();
</script>
</body></html>
<style>.tt{display:inline-block;padding:1px 10px;font-weight:600;font-size:13px;white-space:nowrap;background-size:200% 100%;line-height:1.5}.ttb{animation:ttb 1.6s ease-in-out infinite}.ttg{animation:ttg 1.8s ease-in-out infinite}.ttw{animation:ttw 4s linear infinite}.ttk{animation:ttk 1.2s ease-in-out infinite}
@keyframes ttb{50%{transform:translateY(-2px) rotate(-2deg)}}@keyframes ttg{50%{box-shadow:0 0 10px 2px currentColor}}@keyframes ttw{to{background-position:200% 0}}@keyframes ttk{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.rm .tt{animation:none!important}@media (prefers-reduced-motion:reduce){.tt{animation:none!important}}</style>
